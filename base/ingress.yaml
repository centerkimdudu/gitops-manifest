apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-demo-app
  labels:
    app: gitops-demo-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: gitops-demo.local  # overlay에서 환경별 호스트로 패치됨
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-demo-app
                port:
                  number: 80
