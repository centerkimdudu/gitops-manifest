apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-prod

resources:
  - ../../base
  - pdb.yaml  # PodDisruptionBudget — prod만 적용

images:
  - name: placeholder/gitops-demo-app
    newName: kimtaejung/gitops-demo-app
    newTag: latest  # promote-to-prod workflow가 교체

patches:
  - path: patch-replicas.yaml
  - path: patch-configmap.yaml
  - path: patch-resources.yaml
  - path: patch-ingress.yaml
